<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسار المال - تطبيق المصروفات الشخصية</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent-blue);
            margin-bottom: 5px;
        }

        /* Top Banner Toast */
        #screen-toast {
            display: none; /* مخفي افتراضياً */
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--accent-red);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            align-items: center;
            gap: 12px;
            z-index: 9999;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: bold;
            border: 2px solid #fff;
        }

        #screen-toast.show {
            display: flex;
            transform: translateX(-50%) translateY(0);
        }

        .close-toast-btn {
            cursor: pointer;
            margin-right: 15px;
            font-size: 1.2rem;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .close-toast-btn:hover {
            opacity: 1;
        }

        /* Layout Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: #fff;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--accent-blue);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Stats Cards */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-box.income { border-top: 4px solid var(--accent-green); }
        .stat-box.expense { border-top: 4px solid var(--accent-red); }
        .stat-box.balance { border-top: 4px solid var(--accent-blue); }

        .stat-box h3 { font-size: 0.85rem; color: #94a3b8; }
        .stat-box p { font-size: 1.3rem; font-weight: bold; margin-top: 5px; }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- On-Screen Notification Banner -->
    <div id="screen-toast">
        <i class="fa-solid fa-bell fa-bounce" style="font-size: 1.3rem;"></i>
        <span id="toast-message">تذكير: لم تقم بتسجيل مصروفاتك اليوم!</span>
        <i class="fa-solid fa-xmark close-toast-btn" onclick="hideScreenToast()"></i>
    </div>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-wallet"></i> مسار المال</h1>
            <p>متابعة إحصائياتك وإدارة ميزانيتك اليومية</p>
        </header>

        <!-- Dynamic Quick Stats -->
        <div class="stats-container">
            <div class="stat-box income">
                <h3>إجمالي الدخل</h3>
                <p id="total-income">0 ج.م</p>
            </div>
            <div class="stat-box expense">
                <h3>إجمالي المصروفات</h3>
                <p id="total-expense">0 ج.م</p>
            </div>
            <div class="stat-box balance">
                <h3>الرصيد المتبقي</h3>
                <p id="net-balance">0 ج.م</p>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- Form Section -->
            <div class="side-panel">
                <div class="card">
                    <h2><i class="fa-solid fa-plus-circle"></i> إضافة معاملة</h2>
                    <form id="transaction-form">
                        <div class="form-group">
                            <label>الوصف</label>
                            <input type="text" id="desc" placeholder="مثال: طعام، مواصلات..." required>
                        </div>
                        <div class="form-group">
                            <label>المبلغ (ج.م)</label>
                            <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>النوع</label>
                            <select id="type">
                                <option value="expense">مصروف</option>
                                <option value="income">دخل</option>
                            </select>
                        </div>
                        <button type="submit" class="btn">تسجيل البيانات</button>
                    </form>
                </div>
            </div>

            <!-- Table Section -->
            <div class="main-panel">
                <div class="card">
                    <h2><i class="fa-solid fa-list-check"></i> أحدث المعاملات</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>الوصف</th>
                                <th>المبلغ</th>
                                <th>النوع</th>
                                <th>التاريخ</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-list">
                            <!-- Transactions rendered dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Notification Logic
        function showScreenToast(message) {
            const toast = document.getElementById('screen-toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.add('show');
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                hideScreenToast();
            }, 5000);
        }

        function hideScreenToast() {
            const toast = document.getElementById('screen-toast');
            toast.classList.remove('show');
        }

        function checkAndScheduleReminder() {
            // يمكنك تغيير المنطق هنا لإطلاق الإشعار بناءً على شرط معين بدلاً من التفعيل الفوري
            const hasLoggedToday = false; 
            if (!hasLoggedToday) {
                showScreenToast("تذكير: لم تقم بتسجيل أي مصروفات حتى الآن!");
            }
        }

        // Dummy Data & Transaction Handling
        let transactions = [];

        document.getElementById('transaction-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const desc = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;

            const item = {
                desc,
                amount,
                type,
                date: new Date().toLocaleDateString('ar-EG')
            };

            transactions.push(item);
            updateUI();
            this.reset();
        });

        function updateUI() {
            const list = document.getElementById('transaction-list');
            list.innerHTML = '';

            let incomeTotal = 0;
            let expenseTotal = 0;

            transactions.forEach(t => {
                if (t.type === 'income') incomeTotal += t.amount;
                if (t.type === 'expense') expenseTotal += t.amount;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${t.desc}</td>
                    <td style="color: ${t.type === 'income' ? 'var(--accent-green)' : 'var(--accent-red)'}">${t.amount.toFixed(2)} ج.م</td>
                    <td>${t.type === 'income' ? 'دخل' : 'مصروف'}</td>
                    <td>${t.date}</td>
                `;
                list.appendChild(tr);
            });

            document.getElementById('total-income').innerText = incomeTotal.toFixed(2) + ' ج.م';
            document.getElementById('total-expense').innerText = expenseTotal.toFixed(2) + ' ج.م';
            document.getElementById('net-balance').innerText = (incomeTotal - expenseTotal).toFixed(2) + ' ج.م';
        }

        // Initialize on page load
        document.addEventListener("DOMContentLoaded", () => {
            // تم ضبط الفحص التلقائي للتأكد من المظاهر عند فتح الصفحة
            checkAndScheduleReminder();
        });
    </script>
</body>
</html>
